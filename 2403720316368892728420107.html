<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作這檔事 (職涯隨筆) | Austin Tang</title>
  <meta name="description" content="工作這檔事：職涯經驗與工程思考隨筆。">
  
  <meta http-equiv="refresh" content="0; url=index.html#resources">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-page: #ffffff;
      --bg-surface: #f8fafc;
      --border-light: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-blue: #2563eb;
      --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .redirect-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 40px;
      max-width: 540px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
    }

    .card-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .card-text {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .redirect-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      background: var(--accent-blue);
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .redirect-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <div class="card-icon">💼</div>
    <h1 class="card-title">前往備忘錄與筆記資源區</h1>
    <p class="card-text">
      工作這檔事專頁已整合至 Austin Tang 個人首頁資源庫。正在為您自動跳轉...
    </p>
    <a href="index.html#resources" class="redirect-btn">
      <span>立即前往首頁資源庫 (index.html) ↗</span>
    </a>
  </div>

</body>
</html>
